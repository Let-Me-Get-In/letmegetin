name: letmegetin-prod

services:
  db:
    # Defaults to the official pinned image so production behaviour is
    # unchanged; an arm64 host (Hetzner CAX) sets DB_IMAGE to the image built
    # from docker/Dockerfile.db, because postgis/postgis publishes no arm64
    # manifest.
    image: ${DB_IMAGE:-postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5}
    environment:
      POSTGRES_USER: letmegetin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-letmegetin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready probes a database named after the
      # user, which does not exist once POSTGRES_DB is overridden.
      test: ["CMD-SHELL", "pg_isready -U letmegetin -d ${POSTGRES_DB:-letmegetin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      LETMEGETIN_ENVIRONMENT: ${LETMEGETIN_ENVIRONMENT:-production}
      LETMEGETIN_DATABASE_URL: postgresql+asyncpg://letmegetin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-letmegetin}
      LETMEGETIN_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LETMEGETIN_JWT_SECRET: ${LETMEGETIN_JWT_SECRET:?set LETMEGETIN_JWT_SECRET}
      LETMEGETIN_SENTRY_DSN: ${LETMEGETIN_SENTRY_DSN:-}
      LETMEGETIN_SMTP_HOST: ${LETMEGETIN_SMTP_HOST:-}
      LETMEGETIN_SMTP_PORT: ${LETMEGETIN_SMTP_PORT:-587}
      LETMEGETIN_SMTP_USER: ${LETMEGETIN_SMTP_USER:-}
      LETMEGETIN_SMTP_PASSWORD: ${LETMEGETIN_SMTP_PASSWORD:-}
      LETMEGETIN_SMTP_FROM: ${LETMEGETIN_SMTP_FROM:-no-reply@letmegetin.org}
      LETMEGETIN_PUBLIC_BASE_URL: ${LETMEGETIN_PUBLIC_BASE_URL:-http://localhost:3000}
      LETMEGETIN_GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      default: {}
      edge:
        # Qualified alias: the bare service name `api` is published on every
        # network a service joins, so two stacks would both answer to it and a
        # hostname could reach the other environment's API.
        aliases:
          - ${EDGE_API_ALIAS:?set EDGE_API_ALIAS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      # Qualified on purpose: `http://api` would resolve to whichever stack
      # Docker DNS returns first once both are on the edge network, and the BFF
      # would then serve the other environment's data under this hostname.
      API_URL: http://${EDGE_API_ALIAS:?set EDGE_API_ALIAS}:8000
      API_KEY: ${API_KEY:-}
      # Next's standalone server binds `$HOSTNAME` when it is set, and Docker
      # sets it to the container ID — which resolves to this stack's *default*
      # network address first. On two networks that leaves the shared edge
      # unreachable (502 on this hostname only). 0.0.0.0 listens on every
      # interface the container joins.
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases:
          - ${EDGE_WEB_ALIAS:?set EDGE_WEB_ALIAS}

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: ["observability"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    environment:
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env

networks:
  edge:
    external: true
    name: lmgi-edge

volumes:
  pgdata:
  prometheus_data:
  alertmanager_data:
