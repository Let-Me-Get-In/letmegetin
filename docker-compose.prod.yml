name: letmegetin-prod

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: letmegetin
      POSTGRES_PASSWORD: letmegetin
      POSTGRES_DB: letmegetin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letmegetin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      LETMEGETIN_ENVIRONMENT: production
      LETMEGETIN_DATABASE_URL: postgresql+asyncpg://letmegetin:letmegetin@db:5432/letmegetin
      LETMEGETIN_REDIS_URL: redis://redis:6379/0
      LETMEGETIN_JWT_SECRET: ${LETMEGETIN_JWT_SECRET:?set LETMEGETIN_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
