services:
  db:
    image: postgis/postgis:16-3.4
    container_name: letmegetin-db
    environment:
      POSTGRES_USER: letmegetin
      POSTGRES_PASSWORD: letmegetin
      POSTGRES_DB: letmegetin
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letmegetin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
