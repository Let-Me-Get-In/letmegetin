services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jaccede-db
    environment:
      POSTGRES_USER: jaccede
      POSTGRES_PASSWORD: jaccede
      POSTGRES_DB: jaccede
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaccede"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
