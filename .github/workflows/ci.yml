name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'scripts/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
            web:
              - 'web/**'
            docker:
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'web/**'
            deploy:
              - 'deploy/**'

  lint:
    name: Lint (ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  sast:
    name: SAST (bandit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run bandit -r src -c pyproject.toml

  secret-scan:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan with the project gitleaks config
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.0 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --no-git --redact --no-banner -v

  unit:
    name: Unit tests (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m unit -v

  test:
    name: Tests (pytest + coverage)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: letmegetin
          POSTGRES_PASSWORD: letmegetin
          POSTGRES_DB: letmegetin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letmegetin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LETMEGETIN_DATABASE_URL: postgresql+asyncpg://letmegetin:letmegetin@localhost:5432/letmegetin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Apply migrations (postgres service)
        run: uv run alembic upgrade head
      - name: Seed the referential
        run: uv run python -m letmegetin.seed
      - run: >
          uv run pytest -q
          --cov=letmegetin --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85

  web:
    name: Web (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  openapi:
    name: OpenAPI drift
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code docs/openapi.json

  images:
    name: Docker images
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile --target api -t letmegetin-api .
      - run: docker build -f docker/Dockerfile --target web -t letmegetin-web .

  observability:
    name: Observability config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - name: Caddyfile
        run: |
          docker run --rm -e APP_DOMAIN=app.example.org -e API_DOMAIN=api.example.org \
            -e DEV_APP_DOMAIN=app.dev.example.org -e DEV_API_DOMAIN=api.dev.example.org \
            -e ACME_EMAIL=ops@example.org -v "$PWD/deploy/vps:/etc/caddy:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
