groups:
  - name: letmegetin
    rules:
      - alert: ApiDown
        expr: up{job="letmegetin-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LetMeGetIn API is down"

      - alert: High5xxRate
        expr: >
          sum(rate(letmegetin_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(letmegetin_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API responses are 5xx"

      - alert: High429Rate
        expr: sum(rate(letmegetin_rate_limited_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting is firing more than once per second"

      - alert: RedisDown
        expr: letmegetin_redis_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable (limits fall back per worker)"

      # Host layer: the two silent failures that cost data rather than
      # downtime. `absent()` is deliberate — a marker that was never written is
      # the worst case, not a non-event.
      - alert: BackupStale
        expr: >
          (time() - lmgi_backup_last_success_timestamp_seconds > 129600)
          or absent(lmgi_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Offsite backup is older than 36h, or the marker was never written"

      - alert: DiskFillingUp
        expr: >
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem is below 10% free"

      # The restore drill's two signals, on the same textfile mechanism as BackupStale.
      # The `absent()` branch is mandatory: a drill that stopped running writes nothing
      # at all, and that is the failure worth paging on.
      - alert: RestoreStale
        expr: >
          (time() - letmegetin_restore_last_success_timestamp_seconds > 691200)
          or absent(letmegetin_restore_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Offsite restore drill is older than 8 days, or the success marker was never written"

      # A failure more recent than the last success. The `* 0` carries the failure
      # series' labels so the fallback matches when no success series exists yet -- a
      # first-ever failure fires instead of waiting out the 8-day window.
      - alert: RestoreDrillFailed
        expr: >
          letmegetin_restore_last_failure_timestamp_seconds
          > (letmegetin_restore_last_success_timestamp_seconds
          or letmegetin_restore_last_failure_timestamp_seconds * 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The offsite restore drill failed more recently than it succeeded"
