global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: letmegetin-api
    metrics_path: /metrics
    static_configs:
      # The API under its qualified alias on the shared `lmgi-edge` network.
      # `api:8000` does not resolve here: Prometheus runs in its own Compose
      # project (`lmgi-monitoring`), and a bare service name is private to the
      # project that owns it. The alias is the one the edge's Caddyfile proxies
      # to, which is what makes it the only name both projects can agree on.
      - targets: ["lmgi-prod-api:8000"]

  - job_name: lmgi-node
    static_configs:
      # The host collector, on the monitoring project's private `default`
      # network: both containers live in `lmgi-monitoring`, so the bare service
      # name resolves and no other project can reach it.
      - targets: ["node-exporter:9100"]
