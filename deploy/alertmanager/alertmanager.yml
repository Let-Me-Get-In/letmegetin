# Alerts go to the one Discord channel the rest of the stack reports to.
#
# The webhook is read from a file, never from this file and never from the
# environment: the config repo renders /etc/alertmanager-webhook/webhook.url from
# Infisical at deploy time, mode 0600, and fails the deploy when the secret is
# missing. That is why there is no `--config.expand-env` and no `${…}` below — an
# absent secret used to expand to an empty URL, which Alertmanager rejects, and
# the resulting crash-loop looked exactly like a misconfiguration.

route:
  receiver: discord
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager-webhook/webhook.url
        # The default message links to the Prometheus UI at its own internal
        # address (127.0.0.1:9090), which nobody outside the host can open — and
        # there is no public dashboard on purpose. The link a paged human needs
        # is the checklist that tells them what to do, so it replaces the dead one.
        title: "{{ .CommonLabels.alertname }} — {{ .Status }} ({{ .CommonLabels.severity }})"
        message: |
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
          Runbook: https://github.com/Let-Me-Get-In/letmegetin/blob/main/docs/runbook.md#incident-checklist
